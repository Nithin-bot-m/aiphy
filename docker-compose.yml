# Psychometric AI — full production stack.
#   web     Next.js product UI (proxies /api to the deterministic backend)
#   api     Express psychometric service (PostgreSQL driver)
#   db      PostgreSQL 17 with healthcheck + volume
#   redis   shared rate-limit counters (multi-instance safe)
#   caddy   TLS terminator / reverse proxy (single public entrypoint)
#
# Usage:  cp .env.example .env  →  edit secrets  →  docker compose up -d --build
name: psychometric-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-psychometric}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psych} -d ${POSTGRES_DB:-psychometric}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]

  api:
    build: ./psychometric-ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-psych}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-psychometric}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      BACKEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      # OTP delivery (required for real registrations)
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
      OTP_WEBHOOK_SECRET: ${OTP_WEBHOOK_SECRET:-}
      # LLM (optional; offline template used without keys)
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_DAILY_MAX_REQUESTS: ${LLM_DAILY_MAX_REQUESTS:-200}
      LLM_MONTHLY_TOKEN_BUDGET: ${LLM_MONTHLY_TOKEN_BUDGET:-0}
      # Observability & retention
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_LLM_DAYS: ${RETENTION_LLM_DAYS:-180}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      RETENTION_OUTBOX_DAYS: ${RETENTION_OUTBOX_DAYS:-90}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PSYCHOMETRIC_BACKEND_URL: http://api:4000
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
