# Optional: auto-deploy the frontend Worker on every push to main.
# Enable ONLY after you have deployed once manually (npm run deploy:cf):
#   1. Repo variables:  CF_DEPLOY_ENABLED = true
#                      PSYCHOMETRIC_BACKEND_URL = https://api.your-domain.in
#   2. Repo secrets:    CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit)
#                      CLOUDFLARE_ACCOUNT_ID
name: Deploy frontend to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.CF_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Set backend URL secret (idempotent)
        run: printf '%s' "$PSYCHOMETRIC_BACKEND_URL" | npx wrangler secret put PSYCHOMETRIC_BACKEND_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build + deploy
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
