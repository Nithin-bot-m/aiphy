# ---------------------------------------------------------------------------
# Fly.io sample config for the ALL-IN-ONE container.
#
# `fly launch` generates its own fly.toml — use this as reference or copy it
# to the repo root before deploying. Postgres is attached separately:
#   fly postgres create --name psychometric-ai-db --region bom
#   fly postgres attach psychometric-ai-db --app psychometric-ai-app
#     (this sets DATABASE_URL on the app automatically)
#   fly secrets set JWT_SECRET=$(openssl rand -hex 48) DB_DRIVER=postgres \
#       SEED_DEMO_DATA=false GEMINI_API_KEY=...
#   fly deploy
# ---------------------------------------------------------------------------
app = "psychometric-ai-app"
primary_region = "bom"            # Mumbai — pick your closest region

[build]
  dockerfile = "Dockerfile.all-in-one"

[env]
  NODE_ENV = "production"
  DB_DRIVER = "postgres"
  LLM_MODEL = "gemini-3.8-flash"
  LLM_DAILY_MAX_REQUESTS = "20"
  SEED_DEMO_DATA = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"  # scale to zero when idle (cost saver)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
